<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#e9f3ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11201d" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <title>Tic-Tac-Toe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Literata:opsz,wght@7..72,700&display=swap');

    :root {
      color-scheme: light dark;
      --bg: #e9f3ef;
      --surface: #f8fbf9;
      --surface-strong: #ffffff;
      --ink: #152824;
      --muted: #60736e;
      --line: #b8cbc5;
      --line-strong: #26433d;
      --x: #e45a43;
      --x-soft: #ffe0d8;
      --o: #087f72;
      --o-soft: #caeee7;
      --focus: #086f64;
      --shadow: 0 18px 55px rgba(23, 55, 48, .13);
      --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Literata", Georgia, serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11201d;
        --surface: #172a26;
        --surface-strong: #1d332e;
        --ink: #eff9f5;
        --muted: #9eb4ae;
        --line: #36534c;
        --line-strong: #bad2cb;
        --x: #ff816c;
        --x-soft: #4d2924;
        --o: #65d6c7;
        --o-soft: #173f39;
        --focus: #85e5d8;
        --shadow: 0 22px 60px rgba(0, 0, 0, .32);
      }
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 14% 12%, color-mix(in srgb, var(--o) 11%, transparent) 0 7rem, transparent 7.1rem),
        radial-gradient(circle at 90% 88%, color-mix(in srgb, var(--x) 10%, transparent) 0 9rem, transparent 9.1rem),
        var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    button { font: inherit; }
    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .game {
      width: min(100%, 520px);
      position: relative;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .mode-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .mode-switch button {
      border: 0;
      color: var(--muted);
      background: transparent;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface);
      box-shadow: 0 2px 8px rgba(0,0,0,.14);
    }

    .icon-button {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease;
    }
    .icon-button:hover { transform: rotate(-12deg); border-color: var(--line-strong); }
    .icon-button svg { width: 19px; height: 19px; }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px 22px 12px 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .score {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 78px;
      padding: 12px;
    }
    .score:first-child { background: var(--x-soft); }
    .score:last-child { background: var(--o-soft); }
    .mark-label {
      font-family: var(--font-display);
      font-size: 30px;
      line-height: 1;
    }
    .score:first-child .mark-label { color: var(--x); }
    .score:last-child .mark-label { color: var(--o); }
    .score-copy { display: flex; flex-direction: column; }
    .score-name { color: var(--muted); font-size: 12px; font-weight: 700; }
    .score-value { font-size: 22px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
    .draws {
      min-width: 84px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      border-inline: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .draws b { color: var(--ink); font-size: 20px; line-height: 1.1; letter-spacing: 0; }

    .play-area {
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 28px 28px;
      padding: clamp(24px, 6vw, 38px);
      box-shadow: var(--shadow);
    }

    .status-wrap { text-align: center; min-height: 74px; }
    .status {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1.2;
      letter-spacing: -.025em;
    }
    .substatus {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .board {
      width: min(100%, 370px);
      aspect-ratio: 1;
      margin: 12px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      position: relative;
      isolation: isolate;
    }

    .cell {
      position: relative;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 10%;
      -webkit-tap-highlight-color: transparent;
    }
    .cell::before,
    .cell::after {
      content: "";
      position: absolute;
      background: var(--line-strong);
      border-radius: 999px;
      opacity: .86;
      z-index: -1;
    }
    .cell:not(:nth-child(3n))::after {
      width: 3px;
      height: 88%;
      right: -1.5px;
      top: 6%;
    }
    .cell:nth-child(-n+6)::before {
      width: 88%;
      height: 3px;
      bottom: -1.5px;
      left: 6%;
    }
    .cell:not(:disabled):hover { background: color-mix(in srgb, var(--o) 7%, transparent); border-radius: 16px; }
    .cell:disabled { cursor: default; }
    .cell.win { background: color-mix(in srgb, var(--o) 14%, transparent); border-radius: 18px; }

    .piece {
      width: 76%;
      height: 76%;
      display: block;
      position: relative;
      animation: pop .24s cubic-bezier(.2, .9, .3, 1.35) both;
    }
    .piece.x::before,
    .piece.x::after {
      content: "";
      position: absolute;
      width: 12%;
      height: 100%;
      left: 44%;
      top: 0;
      border-radius: 999px;
      background: var(--x);
      transform: rotate(45deg);
    }
    .piece.x::after { transform: rotate(-45deg); }
    .piece.o {
      border: clamp(8px, 2.2vw, 13px) solid var(--o);
      border-radius: 50%;
    }

    .difficulty {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .difficulty button {
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 4px 2px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .difficulty button[aria-pressed="true"] { color: var(--ink); border-color: var(--o); }
    .difficulty[hidden] { display: none; }

    .result-action {
      display: none;
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      background: var(--ink);
      color: var(--surface);
      font-weight: 700;
      cursor: pointer;
    }
    .result-action.show { display: block; animation: rise .25s ease both; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translate(-50%, 18px);
      padding: 10px 16px;
      background: var(--ink);
      color: var(--surface);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      white-space: nowrap;
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .confetti {
      position: fixed;
      width: 9px;
      height: 16px;
      top: -20px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 20;
      animation: fall var(--dur) linear forwards;
    }

    @keyframes pop { from { transform: scale(.45) rotate(-8deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fall { to { transform: translate3d(var(--drift), 105vh, 0) rotate(720deg); opacity: .85; } }

    @media (max-width: 430px) {
      body { padding-inline: 12px; }
      .topline { margin-bottom: 12px; }
      .mode-switch button { padding-inline: 11px; }
      .score { min-height: 68px; padding: 8px; gap: 7px; }
      .score-name { font-size: 11px; }
      .mark-label { font-size: 26px; }
      .draws { min-width: 68px; }
      .play-area { padding: 23px 18px 24px; }
      .status-wrap { min-height: 66px; }
    }

    @media (max-height: 700px) and (orientation: landscape) {
      body { padding-block: 14px; }
      .game { max-width: 720px; }
      .topline { margin-bottom: 8px; }
      .scoreboard { float: left; width: 31%; grid-template-columns: 1fr; border-radius: 20px 0 0 20px; }
      .score { min-height: 74px; }
      .draws { border-inline: 0; border-block: 1px solid var(--line); padding: 8px; }
      .play-area { margin-left: 31%; border-top: 1px solid var(--line); border-radius: 0 24px 24px 0; padding: 14px 24px; }
      .status-wrap { min-height: 54px; }
      .status { font-size: 24px; }
      .board { width: min(48vh, 310px); margin-top: 2px; }
      .difficulty { margin-top: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Tic-tac-toe game">
    <div class="topline">
      <div class="mode-switch" aria-label="Game mode">
        <button type="button" data-mode="computer" aria-pressed="true">Vs computer</button>
        <button type="button" data-mode="friend" aria-pressed="false">2 players</button>
      </div>
      <button class="icon-button" id="resetAll" type="button" aria-label="Reset scores and board" title="Reset scores">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.34-5.66M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score">
        <span class="mark-label">X</span>
        <span class="score-copy"><span class="score-name" id="xName">You</span><strong class="score-value" id="xScore">0</strong></span>
      </div>
      <div class="draws"><b id="drawScore">0</b><span>Draws</span></div>
      <div class="score">
        <span class="mark-label">O</span>
        <span class="score-copy"><span class="score-name" id="oName">Computer</span><strong class="score-value" id="oScore">0</strong></span>
      </div>
    </section>

    <section class="play-area">
      <div class="status-wrap" aria-live="polite" aria-atomic="true">
        <h1 class="status" id="status">Your move</h1>
        <p class="substatus" id="substatus">You’re X — pick a square</p>
      </div>

      <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board">
        <button class="cell" role="gridcell" data-index="0" aria-label="Top left, empty"></button>
        <button class="cell" role="gridcell" data-index="1" aria-label="Top center, empty"></button>
        <button class="cell" role="gridcell" data-index="2" aria-label="Top right, empty"></button>
        <button class="cell" role="gridcell" data-index="3" aria-label="Middle left, empty"></button>
        <button class="cell" role="gridcell" data-index="4" aria-label="Center, empty"></button>
        <button class="cell" role="gridcell" data-index="5" aria-label="Middle right, empty"></button>
        <button class="cell" role="gridcell" data-index="6" aria-label="Bottom left, empty"></button>
        <button class="cell" role="gridcell" data-index="7" aria-label="Bottom center, empty"></button>
        <button class="cell" role="gridcell" data-index="8" aria-label="Bottom right, empty"></button>
      </div>

      <div class="difficulty" id="difficulty" aria-label="Computer difficulty">
        <span>Difficulty</span>
        <button type="button" data-level="easy" aria-pressed="false">Easy</button>
        <span aria-hidden="true">·</span>
        <button type="button" data-level="smart" aria-pressed="true">Smart</button>
      </div>
      <button class="result-action" id="nextRound" type="button">Play next round</button>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Scores reset</div>

  <script>
    (function () {
      'use strict';

      var WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      var labels = ['Top left','Top center','Top right','Middle left','Center','Middle right','Bottom left','Bottom center','Bottom right'];
      var board = Array(9).fill('');
      var current = 'X';
      var mode = 'computer';
      var level = 'smart';
      var over = false;
      var thinking = false;
      var scores = { X: 0, O: 0, D: 0 };
      var aiTimer = null;

      var cells = Array.prototype.slice.call(document.querySelectorAll('.cell'));
      var status = document.getElementById('status');
      var substatus = document.getElementById('substatus');
      var nextRound = document.getElementById('nextRound');
      var difficulty = document.getElementById('difficulty');
      var toast = document.getElementById('toast');

      function winner(state) {
        for (var i = 0; i < WINS.length; i++) {
          var line = WINS[i];
          if (state[line[0]] && state[line[0]] === state[line[1]] && state[line[0]] === state[line[2]]) {
            return { mark: state[line[0]], line: line };
          }
        }
        return state.indexOf('') === -1 ? { mark: 'D', line: [] } : null;
      }

      function updateNames() {
        document.getElementById('xName').textContent = mode === 'computer' ? 'You' : 'Player 1';
        document.getElementById('oName').textContent = mode === 'computer' ? 'Computer' : 'Player 2';
      }

      function updateScores() {
        document.getElementById('xScore').textContent = scores.X;
        document.getElementById('oScore').textContent = scores.O;
        document.getElementById('drawScore').textContent = scores.D;
      }

      function setTurnCopy() {
        if (mode === 'computer') {
          if (thinking) {
            status.textContent = 'Computer’s thinking…';
            substatus.textContent = 'O is choosing a square';
          } else {
            status.textContent = 'Your move';
            substatus.textContent = 'You’re X — pick a square';
          }
        } else {
          status.textContent = current === 'X' ? 'Player 1’s move' : 'Player 2’s move';
          substatus.textContent = current + ' — pick a square';
        }
      }

      function render() {
        cells.forEach(function (cell, i) {
          var mark = board[i];
          cell.innerHTML = mark ? '<span class="piece ' + mark.toLowerCase() + '" aria-hidden="true"></span>' : '';
          cell.setAttribute('aria-label', labels[i] + ', ' + (mark || 'empty'));
          cell.disabled = !!mark || over || thinking;
          if (!over) cell.classList.remove('win');
        });
        if (!over) setTurnCopy();
      }

      function celebrate() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var colors = ['var(--x)', 'var(--o)', '#f2b84b', '#f5f0df'];
        for (var i = 0; i < 30; i++) {
          var bit = document.createElement('span');
          bit.className = 'confetti';
          bit.style.left = Math.random() * 100 + 'vw';
          bit.style.background = colors[i % colors.length];
          bit.style.setProperty('--dur', (1.6 + Math.random() * 1.4) + 's');
          bit.style.setProperty('--drift', ((Math.random() - .5) * 180) + 'px');
          bit.style.animationDelay = (Math.random() * .35) + 's';
          document.body.appendChild(bit);
          setTimeout(function (node) { node.remove(); }, 3400, bit);
        }
      }

      function finish(result) {
        over = true;
        scores[result.mark] += 1;
        updateScores();
        result.line.forEach(function (i) { cells[i].classList.add('win'); });
        cells.forEach(function (cell) { cell.disabled = true; });

        if (result.mark === 'D') {
          status.textContent = 'Good match — a draw';
          substatus.textContent = 'No empty squares left';
        } else if (mode === 'computer') {
          var humanWon = result.mark === 'X';
          status.textContent = humanWon ? 'You got three!' : 'Computer wins this one';
          substatus.textContent = humanWon ? 'Nice line' : 'Ready for a rematch?';
          if (humanWon) celebrate();
        } else {
          status.textContent = (result.mark === 'X' ? 'Player 1' : 'Player 2') + ' wins!';
          substatus.textContent = result.mark + ' found the line';
          celebrate();
        }
        nextRound.classList.add('show');
        nextRound.focus({ preventScroll: true });
      }

      function minimax(state, maximizing, depth) {
        var result = winner(state);
        if (result) {
          if (result.mark === 'O') return 10 - depth;
          if (result.mark === 'X') return depth - 10;
          return 0;
        }
        var moves = [];
        for (var i = 0; i < state.length; i++) {
          if (!state[i]) {
            state[i] = maximizing ? 'O' : 'X';
            moves.push(minimax(state, !maximizing, depth + 1));
            state[i] = '';
          }
        }
        return maximizing ? Math.max.apply(null, moves) : Math.min.apply(null, moves);
      }

      function bestMove() {
        var open = board.map(function (v, i) { return v ? -1 : i; }).filter(function (i) { return i >= 0; });
        if (level === 'easy') return open[Math.floor(Math.random() * open.length)];
        var best = -Infinity;
        var choices = [];
        open.forEach(function (i) {
          board[i] = 'O';
          var score = minimax(board, false, 0);
          board[i] = '';
          if (score > best) { best = score; choices = [i]; }
          else if (score === best) choices.push(i);
        });
        return choices[Math.floor(Math.random() * choices.length)];
      }

      function computerTurn() {
        if (over || mode !== 'computer') return;
        thinking = true;
        render();
        aiTimer = setTimeout(function () {
          if (over || mode !== 'computer') return;
          var move = bestMove();
          if (typeof move === 'number') board[move] = 'O';
          thinking = false;
          var result = winner(board);
          if (result) finish(result);
          else { current = 'X'; render(); }
        }, 420);
      }

      function play(index) {
        if (over || thinking || board[index]) return;
        board[index] = current;
        var result = winner(board);
        render();
        if (result) { finish(result); return; }
        current = current === 'X' ? 'O' : 'X';
        if (mode === 'computer') computerTurn();
        else render();
      }

      function newRound() {
        clearTimeout(aiTimer);
        board = Array(9).fill('');
        current = 'X';
        over = false;
        thinking = false;
        nextRound.classList.remove('show');
        cells.forEach(function (cell) { cell.classList.remove('win'); });
        render();
        cells[0].focus({ preventScroll: true });
      }

      function resetScores() {
        scores = { X: 0, O: 0, D: 0 };
        updateScores();
        newRound();
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1600);
      }

      cells.forEach(function (cell, i) {
        cell.addEventListener('click', function () { play(i); });
        cell.addEventListener('keydown', function (e) {
          var row = Math.floor(i / 3), col = i % 3, target = null;
          if (e.key === 'ArrowRight') target = row * 3 + ((col + 1) % 3);
          if (e.key === 'ArrowLeft') target = row * 3 + ((col + 2) % 3);
          if (e.key === 'ArrowDown') target = ((row + 1) % 3) * 3 + col;
          if (e.key === 'ArrowUp') target = ((row + 2) % 3) * 3 + col;
          if (target !== null) { e.preventDefault(); cells[target].focus(); }
        });
      });

      document.querySelectorAll('[data-mode]').forEach(function (button) {
        button.addEventListener('click', function () {
          mode = button.getAttribute('data-mode');
          document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === button)); });
          difficulty.hidden = mode !== 'computer';
          scores = { X: 0, O: 0, D: 0 };
          updateNames(); updateScores(); newRound();
        });
      });

      document.querySelectorAll('[data-level]').forEach(function (button) {
        button.addEventListener('click', function () {
          level = button.getAttribute('data-level');
          document.querySelectorAll('[data-level]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === button)); });
          newRound();
        });
      });

      nextRound.addEventListener('click', newRound);
      document.getElementById('resetAll').addEventListener('click', resetScores);
      updateNames(); updateScores(); render();
    })();
  </script>
</body>
</html>
